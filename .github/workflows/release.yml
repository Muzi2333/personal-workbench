name: Release

# 推送 v* 标签时自动打包并发布安装包到 Releases
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 校验标签与版本号一致
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER=$(node -p "require('./package.json').version")
          if [ "v$VER" != "$TAG" ]; then
            echo "标签 $TAG 与 package.json 版本 v$VER 不一致，请先修改版本号" >&2
            exit 1
          fi

      - name: 打包安装包
        run: npx electron-builder --win --publish never

      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            dist/*.exe
            dist/*.blockmap
          generate_release_notes: true
          fail_on_unmatched_files: true
