<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>工作台</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="titlebar" id="titlebar">
    <div class="tb-left">
      <button class="tb-btn slim" id="btn-sidebar" title="显示 / 隐藏侧边栏">
        <svg viewBox="0 0 16 16" width="15" height="15"><rect x="1.8" y="2.4" width="12.4" height="11.2" rx="2" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M6.6 2.4v11.2" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
      <button class="tb-btn slim" id="btn-search" title="搜索（/）">
        <svg viewBox="0 0 16 16" width="14" height="14"><circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M10.6 10.6l3.2 3.2" stroke="currentColor" stroke-width="1.3"/></svg>
      </button>
      <div class="search tb-search hidden" id="tb-search">
        <svg viewBox="0 0 16 16" width="14" height="14" class="search-ico"><circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M10.6 10.6l3.2 3.2" stroke="currentColor" stroke-width="1.3"/></svg>
        <input id="search" type="text" placeholder="搜索快捷方式…" autocomplete="off" spellcheck="false" />
        <span class="kbd">esc</span>
      </div>
      <button class="tb-btn slim" id="btn-lock" title="锁定布局：禁止拖动图标">
        <svg viewBox="0 0 16 16" width="14" height="14" class="ico-unlocked"><rect x="3.2" y="7" width="9.6" height="6.6" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M5.4 7V5a2.6 2.6 0 0 1 5.1-.7" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        <svg viewBox="0 0 16 16" width="14" height="14" class="ico-locked"><rect x="3.2" y="7" width="9.6" height="6.6" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M5.4 7V5a2.6 2.6 0 0 1 5.2 0v2" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="8" cy="10.3" r="1.1" fill="currentColor"/></svg>
      </button>
      <div class="size-box" title="图标大小">
        <span>图标</span>
        <input id="icon-size" type="range" min="36" max="76" step="2" />
      </div>
    </div>
    <div class="tb-right">
      <button class="tb-btn" id="btn-min" title="最小化">
        <svg viewBox="0 0 12 12" width="12" height="12"><path d="M1 6h10" stroke="currentColor" stroke-width="1.1"/></svg>
      </button>
      <button class="tb-btn" id="btn-max" title="最大化">
        <svg viewBox="0 0 12 12" width="12" height="12"><rect x="1.2" y="1.2" width="9.6" height="9.6" fill="none" stroke="currentColor" stroke-width="1.1"/></svg>
      </button>
      <button class="tb-btn close" id="btn-close" title="关闭">
        <svg viewBox="0 0 12 12" width="12" height="12"><path d="M1.6 1.6l8.8 8.8M10.4 1.6L1.6 10.4" stroke="currentColor" stroke-width="1.1"/></svg>
      </button>
    </div>
  </div>

  <div class="body-row">
    <aside class="sidebar" id="sidebar">
      <div class="page-list" id="page-list"></div>
      <div class="sidebar-foot">
        <button class="tb-btn slim" id="btn-settings" title="设置">
          <svg viewBox="0 0 16 16" width="15" height="15"><path d="M6.7 1.8h2.6l.4 1.8c.5.2 1 .5 1.4.9l1.8-.5 1.3 2.3-1.3 1.3c0 .3.1.5.1.8s0 .5-.1.8l1.3 1.3-1.3 2.3-1.8-.5c-.4.4-.9.7-1.4.9l-.4 1.8H6.7l-.4-1.8c-.5-.2-1-.5-1.4-.9l-1.8.5-1.3-2.3 1.3-1.3c-.1-.3-.1-.5-.1-.8s0-.5.1-.8L1.8 6.3 3.1 4l1.8.5c.4-.4.9-.7 1.4-.9l.4-1.8z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><circle cx="8" cy="8.4" r="2.1" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
        </button>
      </div>
    </aside>
    <main class="canvas" id="canvas">
      <div class="grid" id="grid"></div>
    </main>
  </div>

  <footer class="hint" id="hint"></footer>

  <div class="overlay hidden" id="overlay">
    <div class="dialog" id="dialog" role="dialog" aria-modal="true">
      <div class="dialog-head">
        <span id="dialog-title">编辑</span>
        <button class="dialog-x" id="dialog-x">✕</button>
      </div>
      <div class="dialog-body" id="dialog-body"></div>
      <div class="dialog-foot" id="dialog-foot"></div>
    </div>
  </div>

  <div class="menu hidden" id="menu"></div>
  <div class="toast hidden" id="toast"></div>

  <script src="vendor/pinyin-pro.js"></script>
  <script src="grid.js"></script>
  <script src="app.js"></script>
</body>
</html>
