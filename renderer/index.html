<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>工作台</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="titlebar" id="titlebar">
    <div class="tb-left">
      <span class="tb-logo"></span>
      <span class="tb-title">工作台</span>
    </div>
    <div class="tb-right">
      <button class="tb-btn" id="btn-min" title="最小化">
        <svg viewBox="0 0 12 12" width="12" height="12"><path d="M1 6h10" stroke="currentColor" stroke-width="1.1"/></svg>
      </button>
      <button class="tb-btn" id="btn-max" title="最大化">
        <svg viewBox="0 0 12 12" width="12" height="12"><rect x="1.2" y="1.2" width="9.6" height="9.6" fill="none" stroke="currentColor" stroke-width="1.1"/></svg>
      </button>
      <button class="tb-btn close" id="btn-close" title="关闭">
        <svg viewBox="0 0 12 12" width="12" height="12"><path d="M1.6 1.6l8.8 8.8M10.4 1.6L1.6 10.4" stroke="currentColor" stroke-width="1.1"/></svg>
      </button>
    </div>
  </div>

  <header class="toolbar">
    <div class="search">
      <svg viewBox="0 0 16 16" width="15" height="15" class="search-ico"><circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M10.6 10.6l3.2 3.2" stroke="currentColor" stroke-width="1.3"/></svg>
      <input id="search" type="text" placeholder="搜索快捷方式…" autocomplete="off" spellcheck="false" />
      <span class="kbd">/</span>
    </div>
    <div class="tools">
      <div class="size-box" title="图标大小">
        <span>图标</span>
        <input id="icon-size" type="range" min="36" max="76" step="2" />
      </div>
      <button class="btn icon-btn" id="btn-menu" title="更多">⋯</button>
    </div>
  </header>

  <main class="canvas" id="canvas">
    <div class="grid" id="grid"></div>
  </main>

  <footer class="hint" id="hint"></footer>

  <div class="overlay hidden" id="overlay">
    <div class="dialog" id="dialog" role="dialog" aria-modal="true">
      <div class="dialog-head">
        <span id="dialog-title">编辑</span>
        <button class="dialog-x" id="dialog-x">✕</button>
      </div>
      <div class="dialog-body" id="dialog-body"></div>
      <div class="dialog-foot" id="dialog-foot"></div>
    </div>
  </div>

  <div class="menu hidden" id="menu"></div>
  <div class="toast hidden" id="toast"></div>

  <script src="grid.js"></script>
  <script src="app.js"></script>
</body>
</html>
