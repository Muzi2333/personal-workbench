<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>退出强制休息</title>
  <link rel="stylesheet" href="rest.css" />
</head>
<body>
  <div class="pw-card">
    <div class="pw-title">退出强制休息</div>
    <div class="pw-desc">请输入退出密码，密码错误将无法退出。</div>
    <input class="pw-input" id="pw-input" type="password" autocomplete="off" spellcheck="false" placeholder="退出密码" />
    <div class="pw-err" id="pw-err"></div>
    <div class="pw-btns">
      <button class="btn ghost" id="pw-cancel">取消</button>
      <button class="btn primary" id="pw-ok">确认</button>
    </div>
  </div>
  <script src="password.js"></script>
</body>
</html>
