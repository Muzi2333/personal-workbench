<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>强制休息</title>
  <link rel="stylesheet" href="rest.css" />
</head>
<body class="force-body">
  <div class="force-wrap">
    <div class="force-card">
      <div class="force-title">强 制 休 息</div>
      <div class="force-sub">起来走走，眺望远方，喝杯水。<br />休息是为了更好地工作。</div>
      <div class="force-ring" id="force-ring">
        <div class="force-ring-inner">
          <div class="force-time" id="force-time">05:00</div>
          <div class="force-hint" id="force-hint">剩余强制休息时间</div>
        </div>
      </div>
      <button class="force-exit" id="force-exit">结束休息（需密码）</button>
      <div class="force-esc">按 ESC 也可输入密码提前结束</div>
    </div>
  </div>
  <script src="force.js"></script>
</body>
</html>
